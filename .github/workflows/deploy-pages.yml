name: Deploy QuestVault to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static engineering iron-rule checks
        run: |
          if grep -rnE '<form|type="submit"' src/; then
            echo "ERROR: Forbidden <form> or type='submit' found in src/"
            exit 1
          fi
          if grep -rnE 'id="[^"$]+' src/ui/artwork/; then
            echo "ERROR: Static un-namespaced SVG id found in src/ui/artwork/"
            exit 1
          fi

      - name: Run full Vitest suite (core, fuzz, and UI regressions)
        run: npm test

      - name: Verify offline single-file HTML build
        run: npm run build:single

      - name: Build production bundle & verify < 500 kB chunks
        run: |
          npm run build
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("dist/assets").filter((f) => f.endsWith(".js"));
            let max = 0, maxFile = "";
            for (const f of files) {
              const sz = fs.statSync("dist/assets/" + f).size;
              if (sz > max) { max = sz; maxFile = f; }
              if (sz >= 500 * 1024) {
                console.error("ERROR: Vite JS chunk exceeds 500 kB:", f, sz);
                process.exit(1);
              }
            }
            console.log(`Verified ${files.length} JS chunks, max=${maxFile} (${(max / 1024).toFixed(2)} kB < 500 kB)`);
          '

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
