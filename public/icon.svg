<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="chest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Rounded App Icon Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#1C1917" stroke-width="14" />

  <!-- Sparkles -->
  <circle cx="116" cy="116" r="14" fill="#38BDF8" />
  <circle cx="402" cy="108" r="16" fill="#F472B6" />
  <circle cx="418" cy="176" r="9" fill="#34D399" />

  <!-- Crown Star on Top -->
  <polygon
    points="256,64 277,114 332,118 289,152 303,205 256,175 209,205 223,152 180,118 235,114"
    fill="#FDE047"
    stroke="#1C1917"
    stroke-width="12"
    stroke-linejoin="round"
  />

  <!-- Cute QuestVault Treasure Chest -->
  <rect x="108" y="220" width="296" height="196" rx="34" fill="url(#chest)" stroke="#1C1917" stroke-width="14" />
  <!-- Chest Lid Divider -->
  <rect x="108" y="286" width="296" height="24" fill="#1C1917" />
  <!-- Golden Vertical Straps -->
  <rect x="154" y="220" width="24" height="196" fill="#FDE68A" stroke="#1C1917" stroke-width="8" />
  <rect x="334" y="220" width="24" height="196" fill="#FDE68A" stroke="#1C1917" stroke-width="8" />
  <!-- Center Lock Medallion -->
  <rect x="220" y="264" width="72" height="72" rx="20" fill="#FFFDF8" stroke="#1C1917" stroke-width="12" />
  <circle cx="256" cy="296" r="11" fill="#1C1917" />
  <rect x="250" y="302" width="12" height="18" rx="4" fill="#1C1917" />

  <!-- 3 Subject Gems (EN Blue, Math Green, ZH Pink) -->
  <circle cx="192" cy="368" r="16" fill="#2563EB" stroke="#1C1917" stroke-width="7" />
  <circle cx="256" cy="368" r="16" fill="#059669" stroke="#1C1917" stroke-width="7" />
  <circle cx="320" cy="368" r="16" fill="#DB2777" stroke="#1C1917" stroke-width="7" />
</svg>
